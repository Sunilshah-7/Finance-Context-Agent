services:

  # --- LLM: Qwen2.5-72B-Instruct — final analyst memo generation ---
  vllm-72b:
    image: vllm/vllm-openai:latest
    container_name: fincontext-vllm-72b
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME:-/models/huggingface}
    volumes:
      - ${MODEL_CACHE_DIR:-/models}:/models
    command:
      - --model
      - ${VLLM_REASONER_MODEL_ID:-Qwen/Qwen2.5-72B-Instruct}
      - --served-model-name
      - ${VLLM_REASONER_SERVED_NAME:-fincontext-reasoner}
      - --tensor-parallel-size
      - "${VLLM_REASONER_TENSOR_PARALLEL:-1}"
      - --max-model-len
      - "${VLLM_REASONER_MAX_MODEL_LEN:-65536}"
      - --gpu-memory-utilization
      - "${VLLM_REASONER_GPU_UTILIZATION:-0.85}"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s   # 72B takes 3-5 minutes to load

  # --- LLM: Qwen2.5-14B-Instruct — retrieval planning, diff classification ---
  vllm-14b:
    image: vllm/vllm-openai:latest
    container_name: fincontext-vllm-14b
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME:-/models/huggingface}
    volumes:
      - ${MODEL_CACHE_DIR:-/models}:/models
    command:
      - --model
      - ${VLLM_PLANNER_MODEL_ID:-Qwen/Qwen2.5-14B-Instruct}
      - --served-model-name
      - ${VLLM_PLANNER_SERVED_NAME:-fincontext-planner}
      - --tensor-parallel-size
      - "${VLLM_PLANNER_TENSOR_PARALLEL:-1}"
      - --gpu-memory-utilization
      - "${VLLM_PLANNER_GPU_UTILIZATION:-0.16}"
      - --max-model-len
      - "${VLLM_PLANNER_MAX_MODEL_LEN:-16384}"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --- Embeddings: BAAI/bge-large-en-v1.5 via HuggingFace TEI ---
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: fincontext-tei-embedding
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ports:
      - "8002:80"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ${MODEL_CACHE_DIR:-/models}/tei-embedding:/data
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      - --port
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Reranker: BAAI/bge-reranker-large via HuggingFace TEI ---
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: fincontext-tei-reranker
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ports:
      - "8003:80"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ${MODEL_CACHE_DIR:-/models}/tei-reranker:/data
    command:
      - --model-id
      - ${RERANKER_MODEL_ID:-BAAI/bge-reranker-large}
      - --port
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Vector store: Qdrant ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fincontext-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
    driver: local
