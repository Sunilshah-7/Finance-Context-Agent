name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/schemas
          (cd services/ingestion-worker && python -m pip install -r requirements.txt)
          python -m pip install -r services/inference-gateway/requirements.txt

      - name: Shared schema import smoke
        run: |
          python - <<'PY'
          from fincontext_schemas.state import AnalysisState
          from fincontext_schemas.api import AnalyzeRequest
          from fincontext_schemas.db import ChunkRow

          assert AnalysisState(user_id="ci", portfolio_id="demo").user_id == "ci"
          assert AnalyzeRequest(portfolio_id="portfolio_1").portfolio_id == "portfolio_1"
          assert ChunkRow.table_name == "chunks"
          PY

      - name: Run ingestion worker tests
        run: python -m pytest services/ingestion-worker/tests -x

      - name: Run inference gateway tests
        run: python -m pytest services/inference-gateway/tests -x

      - name: Run infra tests
        run: |
          if [ -d infra/tests ]; then
            python -m pytest infra/tests -x
          else
            echo "No infra tests yet"
          fi

      - name: Run eval tests when present
        run: |
          if [ -d packages/evals/tests ]; then
            python -m pytest packages/evals/tests -x
          else
            echo "No eval tests yet"
          fi

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            packages/schemas/python \
            services/ingestion-worker \
            services/inference-gateway \
            infra

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Block generated files and local secrets
        run: |
          bad_files="$(
            git ls-files | grep -E '(^|/)(__pycache__/|\.pytest_cache/)|\.pyc$|\.db$|(^|/)\.env$|(^|/)qdrant_storage/|(^|/)models/' || true
          )"
          if [ -n "$bad_files" ]; then
            echo "These generated or secret-bearing files must not be committed:"
            echo "$bad_files"
            exit 1
          fi

      - name: Enforce no new emoji in changed text files
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import re
          import subprocess
          import sys

          emoji = re.compile(
              "["
              "\U0001F300-\U0001FAFF"
              "\U00002600-\U000027BF"
              "]"
          )
          text_suffixes = {
              ".md",
              ".py",
              ".sql",
              ".toml",
              ".txt",
              ".yml",
              ".yaml",
          }

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          before_sha = os.environ.get("GITHUB_EVENT_BEFORE", "")

          if event_name == "pull_request":
              diff_args = ["git", "diff", "--name-only", "HEAD^1..HEAD"]
          elif before_sha and set(before_sha) != {"0"}:
              diff_args = ["git", "diff", "--name-only", f"{before_sha}..HEAD"]
          else:
              diff_args = ["git", "diff", "--name-only", "HEAD~1..HEAD"]

          files = subprocess.check_output(diff_args, text=True).splitlines()
          offenders: list[str] = []
          for file_name in files:
              path = pathlib.Path(file_name)
              if not path.exists():
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if emoji.search(text):
                  offenders.append(file_name)

          if offenders:
              print("Emoji are not allowed in committed text files:")
              for offender in offenders:
                  print(f"- {offender}")
              sys.exit(1)
          PY
